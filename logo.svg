<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#0a5fd6"/>
    </linearGradient>
  </defs>

  <!-- App-icon background: rounded square, Apple-style corner radius -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Signal wire between the two blocks -->
  <line x1="222" y1="256" x2="286" y2="256" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <path d="M262 234 L296 256 L262 278 Z" fill="#ffffff"/>

  <!-- Left block -->
  <rect x="86" y="196" width="134" height="120" rx="26" fill="#ffffff"/>
  <!-- Right block -->
  <rect x="292" y="196" width="134" height="120" rx="26" fill="#ffffff" opacity="0.94"/>

  <!-- Ports: green = output (left block), orange = input (right block),
       matching the app's own port color coding on the canvas. -->
  <circle cx="220" cy="256" r="15" fill="#34c759"/>
  <circle cx="292" cy="256" r="15" fill="#ff9500"/>
</svg>
